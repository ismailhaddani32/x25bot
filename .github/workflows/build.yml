
name: Build X25 POOL APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o X25_POOL_FRESH_PROJECT_WITH_WORKFLOW.zip -d project
          find project -name settings.gradle.kts

      - name: Locate project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: X25-POOL-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
