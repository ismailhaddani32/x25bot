
name: Build X25 POOL APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir project
          unzip -o X25_POOL_FRESH_PROJECT_WITH_WORKFLOW.zip -d project
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configure Java and Kotlin targets
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import sys
          import re
          p = sys.argv[1]
          s = open(p).read()
          if 'compileOptions {' in s:
              s = re.sub(r'compileOptions\s*\{.*?\}', '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''', s, count=1, flags=re.S)
          else:
              s = re.sub(r'android\s*\{', '''android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }''', s, count=1)
          if 'kotlinOptions {' in s:
              s = re.sub(r'kotlinOptions\s*\{.*?\}', '''kotlinOptions {
                  jvmTarget = "17"
              }''', s, count=1, flags=re.S)
          else:
              s = re.sub(r'android\s*\{', '''android {
                  kotlinOptions {
                      jvmTarget = "17"
                  }''', s, count=1)
          open(p, 'w').write(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X25-POOL-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
